<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Adhim Musafak, mobile and web developer</title>
  <desc id="desc">A dark navy GitHub profile banner with modern blue detailing and a code window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="70%" stop-color="#101F36"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#61DAFB"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" stroke="#1A3451" stroke-width="1" fill="none" opacity=".33"/>
    </pattern>
    <clipPath id="round"><rect width="1100" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1100" height="300" fill="url(#bg)"/>
    <rect width="1100" height="300" fill="url(#grid)"/>
    <circle cx="915" cy="40" r="200" fill="#173C64" opacity=".29"/>
    <circle cx="1050" cy="230" r="145" fill="#173C64" opacity=".16"/>
    <rect x="0" y="0" width="7" height="300" fill="url(#glow)"/>
    <text x="66" y="64" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="15" letter-spacing="3" fill="#7EB9F9">HELLO, I'M</text>
    <text x="62" y="140" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="57" fill="#F0F6FC">Adhim Musafak</text>
    <text x="66" y="189" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="30" fill="url(#glow)">Mobile &amp; Web Developer</text>
    <path d="M 66 209 H 510" stroke="#30577D" stroke-width="1.5"/>
    <text x="66" y="241" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B5C8DA">JavaScript  /  React  /  Flutter  /  Python</text>
    <text x="66" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="2" fill="#7798BC">GITHUB.COM/NDORRRRR</text>
    <rect x="699" y="63" width="325" height="189" rx="11" fill="#0C1525" stroke="#34577F" stroke-width="1.5"/>
    <path d="M 710 63 H 1013 Q 1024 63 1024 74 V 94 H 699 V 74 Q 699 63 710 63" fill="#16283F"/>
    <circle cx="722" cy="79" r="4" fill="#FF7B72"/>
    <circle cx="737" cy="79" r="4" fill="#F2CC60"/>
    <circle cx="752" cy="79" r="4" fill="#3FB950"/>
    <text x="870" y="83" font-family="monospace" font-size="12" fill="#8499B2" text-anchor="middle">adhim.dev</text>
    <text x="724" y="126" font-family="monospace" font-size="18" fill="#B5D6F6">&lt;<tspan fill="#7EE787">developer</tspan>&gt;</text>
    <text x="743" y="158" font-family="monospace" font-size="16" fill="#79C0FF">const <tspan fill="#F2CC60">focus</tspan> = [</text>
    <text x="764" y="185" font-family="monospace" font-size="15" fill="#A5D6FF">'web', 'mobile',</text>
    <text x="764" y="211" font-family="monospace" font-size="15" fill="#A5D6FF">'useful products'</text>
    <text x="743" y="237" font-family="monospace" font-size="16" fill="#79C0FF">];</text>
  </g>
</svg>
